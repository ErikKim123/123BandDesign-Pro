<!-- @dsCard group="Colors" viewport="700x150" name="Lines & Dark Surface" subtitle="Hairlines + the dark code/photographic surface" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--color-canvas);font-family:var(--font-ui);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:110px;height:64px;border-radius:var(--radius-md);}
  .name{font-size:12px;font-weight:600;color:var(--color-ink);}
  .hex{font-size:11px;color:var(--color-steel);font-family:var(--font-mono);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-hairline)"></div><span class="name">hairline</span><span class="hex">#e5e5e5</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-hairline-soft)"></div><span class="name">hairline-soft</span><span class="hex">#ededed</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-hairline-strong)"></div><span class="name">hairline-strong</span><span class="hex">#c7c7c7</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface-code)"></div><span class="name">surface-code</span><span class="hex">#1c1c1e</span></div>
  </div>
</body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Cream & Warm Surfaces" subtitle="Warm neutral surfaces for panels, cards, footer" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--color-canvas);font-family:var(--font-ui);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:120px;height:64px;border-radius:var(--radius-md);border:1px solid var(--color-hairline);}
  .name{font-size:12px;font-weight:600;color:var(--color-ink);}
  .hex{font-size:11px;color:var(--color-steel);font-family:var(--font-mono);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-cream)"></div><span class="name">cream</span><span class="hex">#fff8e0</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-cream-light)"></div><span class="name">cream-light</span><span class="hex">#fffaeb</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-cream-deeper)"></div><span class="name">cream-deeper</span><span class="hex">#fff0c2</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-beige-deep)"></div><span class="name">beige-deep</span><span class="hex">#e6d5a8</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface)"></div><span class="name">surface</span><span class="hex">#fafafa</span></div>
  </div>
</body></html>

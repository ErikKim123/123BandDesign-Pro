<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Sunset" subtitle="Primary orange + the sunshine spectrum" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--color-canvas);font-family:var(--font-ui);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:96px;height:64px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06);}
  .name{font-size:12px;font-weight:600;color:var(--color-ink);}
  .hex{font-size:11px;color:var(--color-steel);font-family:var(--font-mono);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><span class="name">primary</span><span class="hex">#fa520f</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-primary-deep)"></div><span class="name">primary-deep</span><span class="hex">#cc3a05</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-sunshine-900)"></div><span class="name">sunshine-900</span><span class="hex">#ff8a00</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-sunshine-700)"></div><span class="name">sunshine-700</span><span class="hex">#ffa110</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-sunshine-500)"></div><span class="name">sunshine-500</span><span class="hex">#ffb83e</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-sunshine-300)"></div><span class="name">sunshine-300</span><span class="hex">#ffd06a</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-yellow-saturated)"></div><span class="name">yellow-sat</span><span class="hex">#ffd900</span></div>
  </div>
</body></html>

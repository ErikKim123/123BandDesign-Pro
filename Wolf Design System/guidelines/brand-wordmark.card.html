<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);}
  .sky{position:relative;height:240px;background:var(--sunset-sky);display:flex;align-items:center;justify-content:center;}
  .mark{font-family:var(--font-display);font-size:84px;letter-spacing:2px;color:var(--color-ink);line-height:1;}
  .mark sup{font-size:24px;color:var(--color-primary);vertical-align:super;}
  .tag{position:absolute;bottom:18px;left:24px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--color-ink-tint);}
</style></head>
<body>
  <div class="sky">
    <div class="mark">WOLF<sup>●</sup></div>
    <span class="tag">Festival Pass · 세상의 모든 무대</span>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--color-canvas); font-family: var(--font-ui); }
  .pad { padding: 28px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--color-stone); margin: 0 0 12px; }
  .block { margin-bottom: 28px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Tabs, PromoBanner } = window.WolfDesignSystem_4d4911;
    function Demo() {
      return (
        <div>
          <PromoBanner ctaLabel="지금 예매 →" ctaHref="#" dismissible>
            🎟 얼리버드 패스 한정 판매 — 6월 30일 마감
          </PromoBanner>
          <div className="pad">
            <div className="block">
              <p className="label">Segmented</p>
              <Tabs variant="segmented" defaultValue="lineup" items={[
                {value:"lineup",label:"라인업"},{value:"info",label:"안내"},{value:"map",label:"오시는 길"},{value:"faq",label:"FAQ"}
              ]} />
            </div>
            <div className="block" style={{marginBottom:0}}>
              <p className="label">Pill</p>
              <Tabs variant="pill" defaultValue="all" items={[
                {value:"all",label:"전체"},{value:"edm",label:"EDM"},{value:"indie",label:"인디"},{value:"hiphop",label:"힙합"}
              ]} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--color-canvas); font-family: var(--font-ui); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--color-stone); margin: 0 0 10px; }
  .group { margin-bottom: 24px; }
  .cream-strip { background: var(--color-cream); border: 1px solid var(--color-beige-deep); border-radius: var(--radius-lg); padding: 18px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Badge } = window.WolfDesignSystem_4d4911;
    function Demo() {
      return (
        <div>
          <div className="group">
            <p className="label">Buttons</p>
            <div className="row">
              <Button variant="primary">패스 구매</Button>
              <Button variant="dark">티켓 보기</Button>
              <Button variant="secondary">자세히</Button>
              <Button variant="link" href="#">전체 보기 →</Button>
              <Button variant="primary" disabled>구매</Button>
            </div>
            <div className="cream-strip row" style={{marginBottom:0}}>
              <Button variant="cream">라인업</Button>
              <Button variant="on-cream">위치 보기</Button>
              <Button variant="primary">예매하기</Button>
            </div>
          </div>
          <div className="group" style={{marginBottom:0}}>
            <p className="label">Sizes</p>
            <div className="row" style={{marginBottom:16}}>
              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" size="md">Medium</Button>
              <Button variant="primary" size="lg">Large</Button>
            </div>
            <p className="label">Badges</p>
            <div className="row" style={{marginBottom:0}}>
              <Badge variant="orange">얼리버드</Badge>
              <Badge variant="cream">3-DAY PASS</Badge>
              <Badge variant="dark">SOLD OUT</Badge>
              <Badge variant="outline">EDM</Badge>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>

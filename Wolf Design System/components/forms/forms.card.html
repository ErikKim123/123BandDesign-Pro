<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--color-canvas); font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; max-width: 640px; }
  .span { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, Textarea } = window.WolfDesignSystem_4d4911;
    function Demo() {
      return (
        <div className="grid">
          <Input label="이름" placeholder="홍길동" />
          <Input label="이메일" placeholder="you@example.com" hint="예매 확인 메일 발송" />
          <Select label="결제 방법" options={[{value:"card",label:"신용카드"},{value:"kakao",label:"카카오페이"},{value:"naver",label:"네이버페이"}]} />
          <Input label="전화번호" placeholder="010-0000-0000" error="번호를 확인해 주세요" />
          <Textarea wrapperStyle={{gridColumn:"1 / -1"}} label="요청사항 (선택)" rows={3} placeholder="휠체어 접근 등 요청사항을 적어주세요" />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
